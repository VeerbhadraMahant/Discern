# vram_gb is approximate (weights plus a margin). Restorers and the super-resolver carry measured
# peak torch allocations at 1280x720 (scripts/restore_demo.py --bench) plus a small margin.
# Verified 2026-10-03 against the HF API, GitHub API and upstream license files.
