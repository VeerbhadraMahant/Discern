name: gate

# Runs the GPU evaluation gate (system-design 10.3) on a SELF-HOSTED runner, only on pushes to
# main and manual dispatch. It must never run on pull_request: a self-hosted runner executes
# whatever code the trigger carries, so untrusted PR code must not reach it.
# The runner must be registered by the repo owner (Settings > Actions > Runners) with the
# labels below; nothing in this repository registers it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: [self-hosted, windows, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # the runner is a personal machine
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group gpu --group eval
      # The gate subset evaluation writes its metrics to the MLflow experiment named in
      # configs/thresholds.yaml (eval_gate.experiment); run_gate.py reads the latest run.
      - run: uv run python scripts/run_gate.py
