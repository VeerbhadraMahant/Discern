<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Discern is an open-model research prototype: ask questions about a video and see the boxes, tracks and timestamps behind each answer. Work in progress; the hosted Space is not deployed yet."
    />
    <meta name="theme-color" content="#e2dedb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Discern" />
    <meta property="og:title" content="Discern: ask a video a question, see the evidence" />
    <meta
      property="og:description"
      content="An open-model research prototype for grounded video questions. Work in progress; the hosted Space is not deployed yet."
    />
    <meta name="twitter:card" content="summary" />
    <title>Discern | Ask a video a question, see the evidence</title>
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Preload the display face only for the landing page (an empty or in-page hash), not for the app tabs.
      (function () {
        var tab = /^#\/?(clean|ask|trace|feedback|about)([?/]|$)/.test(location.hash);
        if (tab) return;
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "font";
        l.type = "font/woff2";
        l.crossOrigin = "anonymous";
        l.href = "/fonts/montserrat-latin-700-normal.woff2";
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
