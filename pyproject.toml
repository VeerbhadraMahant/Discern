[project]
name = "discern"
version = "0.1.0"
description = "Degradation-aware, grounded video query agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
# Heavy runtime deps. Not installed in CI: `uv sync --group gpu --group eval` locally.
gpu = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57",
    "ultralytics>=8.3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
]
eval = [
    "mlflow>=3.0",
    "huggingface-hub>=0.25",
    "pycocotools>=2.0.8",
    "remotezip>=0.12.6",
]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not slow and not eval'"
markers = [
    "gpu: needs CUDA",
    "slow: downloads or long runs",
    "eval: evaluation harness",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/discern"]
plugins = ["pydantic.mypy"]

# Heavy runtime libraries are not installed in CI, and adapters wrap untyped third-party APIs.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "ultralytics.*", "PIL.*", "mlflow.*", "huggingface_hub.*", "remotezip.*", "cv2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["discern.models.adapters.*"]
ignore_errors = true
