[project]
name = "discern"
version = "0.1.0"
description = "Degradation-aware, grounded video query agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not slow and not eval'"
markers = [
    "gpu: needs CUDA",
    "slow: downloads or long runs",
    "eval: evaluation harness",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/discern"]
plugins = ["pydantic.mypy"]
